[project]
name = "epistemic-control-kernel"
dynamic = ["version"]
description = "A reliability-focused control kernel for autonomous agents with prediction, execution, evaluation, drift detection, and policy-based gating."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = [
    "epistemic-control",
    "agent",
    "reliability",
    "drift-detection",
    "self-regulation",
    "autonomous-systems",
]
authors = [
    {name = "robotransit"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0",
]
embeddings = [
    "sentence-transformers",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "eck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["eck"]

[tool.pytest.ini_options]
# Strict marker enforcement — unknown markers fail the run
addopts = "--strict-markers"
testpaths = ["tests"]

# Test markers (ADR-035)
# Core markers: blocking, deterministic, stdlib-only
# Capability marker: non-blocking, may use optional extras
markers = [
    "core: deterministic invariant tests (blocking)",
    "guardrail: ADR-033 no-leakage and authority boundary tests (blocking)",
    "memory: memory retrieval toggle and equivalence tests (blocking)",
    "critic: critic parsing, pessimistic failure, severity tests (blocking)",
    "policy: policy mode irreversibility and gate contract tests (blocking)",
    "queue: TaskQueue deterministic ordering and overflow tests (blocking)",
    "confidence: confidence signal EWMA and invariant tests (blocking)",
    "similarity: similarity retrieval core and fallback tests (blocking)",
    "capability: optional extras and integration tests (non-blocking)",
]
