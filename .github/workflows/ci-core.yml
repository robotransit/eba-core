# .github/workflows/ci-core.yml
# Deterministic Core Layer — blocking (ADR-034/035)
# Runs on every push and pull_request to main.
# Fails → PR/merge blocked.
# stdlib-only, no network, no real LLMs, no optional extras.

name: CI Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: core-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: core-${{ matrix.python-version }}-

      - name: Install test dependencies (no extras)
        run: pip install -e ".[test]"

      - name: Run deterministic core tests
        run: |
          pytest \
            --cov=eck \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=95 \
            --strict-markers \
            --tb=short \
            -v

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7
