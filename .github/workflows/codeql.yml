# .github/workflows/codeql.yml
# Static Analysis Layer — ADR-046
# python/security-extended — blocking from day one
# python/quality — non-blocking initially (not included in this minimal version)
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3   # v3 is still supported for now
        with:
          languages: python
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis (security-extended — blocking)
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
